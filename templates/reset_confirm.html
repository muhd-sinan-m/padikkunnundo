<!DOCTYPE html>
<html lang="en">
<head>
  {% include 'analytics.html' %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Set New Password — padikkunnundo.app</title>
  <meta name="description" content="Set your new password on padikkunnundo.app.">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/favicon-16x16.png') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v=20260905-1">
</head>
<body>

<div class="login-page">
  <div class="login-shell">
    <section class="login-visual">
      <div class="login-visual-art">
        <img
          src="{{ url_for('static', filename='img/reset_request.webp') }}"
          alt="Set new password illustration"
          decoding="async"
        >
      </div>

      <div class="login-visual-stats">
        <div>
          <strong>Study?</strong>
          <span>Daily check-in</span>
        </div>
        <div>
          <strong>Marks</strong>
          <span>Track clearly</span>
        </div>
        <div>
          <strong>Goals</strong>
          <span>Stay ready</span>
        </div>
      </div>
    </section>

    <section class="login-panel">
      <div class="login-panel-inner">
        <div class="login-brand">
          <div>
            <h1>padikkunnundo.app</h1>
            <p>{{ college_name }}</p>
          </div>
        </div>

        {% if error %}
        <div class="login-error" role="alert" id="login-error">
          {{ error }}
        </div>
        {% endif %}

        <div class="auth-panel-frame">
          <div class="auth-panel active">
            <h2 class="form-title">Set New Password</h2>
            <p class="form-description">
              Enter your new password below.
            </p>
            <form action="{{ url_for('auth.reset_password_confirm', token=token) }}" method="post" class="auth-form">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <label>
                <span>New Password</span>
                <div class="password-input-wrapper">
                  <input type="password" name="password" id="new-password" placeholder="Enter new password" autocomplete="new-password" required>
                  <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility" tabindex="-1">
                    <svg class="eye-open-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg class="eye-closed-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                      <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                  </button>
                </div>
              </label>
              <label>
                <span>Confirm Password</span>
                <div class="password-input-wrapper">
                  <input type="password" name="confirm_password" placeholder="Confirm new password" autocomplete="new-password" required>
                  <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility" tabindex="-1">
                    <svg class="eye-open-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg class="eye-closed-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                      <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                  </button>
                </div>
              </label>
              <button type="submit" class="auth-submit">Reset Password</button>
            </form>
          </div>
        </div>

      </div>
    </section>
  </div>
</div>

<script>
  document.querySelectorAll('.password-toggle-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const wrapper = btn.closest('.password-input-wrapper');
      const input = wrapper ? wrapper.querySelector('input') : null;
      if (!input) return;

      const eyeOpen = btn.querySelector('.eye-open-icon');
      const eyeClosed = btn.querySelector('.eye-closed-icon');

      if (input.type === 'password') {
        input.type = 'text';
        if (eyeOpen) eyeOpen.style.display = 'none';
        if (eyeClosed) eyeClosed.style.display = 'block';
        btn.setAttribute('aria-label', 'Hide password');
      } else {
        input.type = 'password';
        if (eyeOpen) eyeOpen.style.display = 'block';
        if (eyeClosed) eyeClosed.style.display = 'none';
        btn.setAttribute('aria-label', 'Show password');
      }
    });
  });
</script>

</body>
</html>
