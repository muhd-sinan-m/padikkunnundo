<!DOCTYPE html>
<html lang="en">
<head>
  {% include 'analytics.html' %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Feedback — padikkunnundo.app</title>
  <meta name="title" content="Student Feedback — padikkunnundo.app">
  <meta name="description" content="Share your thoughts and feedback on padikkunnundo.app to help us improve your academic companion for next semester.">

  <!-- Open Graph / WhatsApp / Facebook Preview -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="padikkunnundo.app">
  <meta property="og:title" content="Student Feedback — padikkunnundo.app">
  <meta property="og:description" content="Share your thoughts and feedback on padikkunnundo.app to help us improve your academic companion for next semester.">
  <meta property="og:url" content="{{ url_for('pages.feedback', _external=True) }}">
  <meta property="og:image" content="{{ url_for('static', filename='img/dashboard_logo.webp', _external=True) }}">
  <meta property="og:image:secure_url" content="{{ url_for('static', filename='img/dashboard_logo.webp', _external=True) }}">
  <meta property="og:image:type" content="image/webp">
  <meta property="og:image:width" content="1024">
  <meta property="og:image:height" content="1024">
  <meta property="og:image:alt" content="padikkunnundo.app Student Feedback">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Student Feedback — padikkunnundo.app">
  <meta name="twitter:description" content="Share your thoughts and feedback on padikkunnundo.app to help us improve your academic companion for next semester.">
  <meta name="twitter:image" content="{{ url_for('static', filename='img/dashboard_logo.webp', _external=True) }}">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/favicon-16x16.png') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <style>
    .auth-req-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 4vw, 32px);
      background:
        radial-gradient(circle at top, rgba(59, 130, 246, 0.05), transparent 22%),
        var(--bg-secondary);
    }

    .auth-req-card {
      max-width: 460px;
      width: 100%;
      background: #FFFFFF;
      border: 1.5px solid var(--border-color);
      border-radius: 20px;
      padding: clamp(32px, 6vw, 44px) clamp(20px, 5vw, 36px);
      text-align: center;
      box-shadow: 0 12px 32px -4px rgba(15, 23, 42, 0.05), 0 4px 12px -2px rgba(15, 23, 42, 0.03);
    }

    .auth-req-logo-link {
      display: inline-block;
      margin-bottom: 24px;
      transition: opacity var(--transition);
    }

    .auth-req-logo-link:hover {
      opacity: 0.85;
    }

    .auth-req-logo-img {
      height: 48px;
      width: auto;
      display: block;
      margin: 0 auto;
    }

    .auth-req-icon-box {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--gray-50);
      border: 1px solid var(--border-color);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #0F172A;
      margin-bottom: 18px;
    }

    .auth-req-heading {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.4px;
      margin-bottom: 10px;
      line-height: 1.25;
    }

    .auth-req-message {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 28px;
      max-width: 360px;
      margin-left: auto;
      margin-right: auto;
    }

    .auth-req-btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .auth-req-btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      background: #0F172A;
      color: #FFFFFF;
      border: 1.5px solid #0F172A;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.12);
      transition: all 0.18s ease;
      flex: 1;
      min-width: 140px;
    }

    .auth-req-btn-home:hover {
      background: #1E293B;
      border-color: #1E293B;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.18);
    }

    .auth-req-btn-login {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      background: #FFFFFF;
      color: var(--text-primary);
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.18s ease;
      flex: 1;
      min-width: 140px;
    }

    .auth-req-btn-login:hover {
      background: var(--gray-50);
      border-color: var(--gray-300);
      color: #0F172A;
    }

    @media (max-width: 480px) {
      .auth-req-card {
        padding: 28px 18px;
      }
      .auth-req-btn-group {
        flex-direction: column;
        width: 100%;
      }
      .auth-req-btn-home,
      .auth-req-btn-login {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="auth-req-wrapper">
  <div class="auth-req-card">
    <a href="/" class="auth-req-logo-link" title="padikkunnundo.app home">
      <img src="{{ url_for('static', filename='img/logo_about.webp') }}" alt="padikkunnundo.app logo" class="auth-req-logo-img" decoding="async">
    </a>

    <div class="auth-req-icon-box" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>

    <h1 class="auth-req-heading">Authentication Required</h1>
    <p class="auth-req-message">
      You need to be logged in to access this page. Please log in with your Marian College student account to continue.
    </p>

    <div class="auth-req-btn-group">
      <a href="/" class="auth-req-btn-home">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Home Page</span>
      </a>
      <a href="{{ url_for('pages.login') }}" class="auth-req-btn-login">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
        <span>Log In</span>
      </a>
    </div>
  </div>
</div>

</body>
</html>
