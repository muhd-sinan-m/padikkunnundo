<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 — Internal Server Error | padikkunnundo.app</title>
  <meta name="description" content="An unexpected server error occurred on padikkunnundo.app.">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/favicon-16x16.png') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <style>
    .error-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-lg);
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      color: #F8FAFC;
    }
    .error-card {
      max-width: 520px;
      width: 100%;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 44px 36px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
    }
    .error-logo {
      height: 56px;
      width: auto;
      margin-bottom: 24px;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
    }
    .error-code-pill-red {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 99px;
      background: rgba(239, 68, 68, 0.15);
      border: 1.5px solid rgba(239, 68, 68, 0.4);
      color: #F87171;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 18px;
    }
    .error-title {
      font-size: 26px;
      font-weight: 900;
      color: #FFFFFF;
      margin-bottom: 12px;
    }
    .error-desc {
      font-size: 14px;
      color: #94A3B8;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .error-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-secondary-dark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 1.4rem;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      color: #F8FAFC;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-secondary-dark:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.25);
      color: #FFFFFF;
    }
    .btn-primary-glow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 1.4rem;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366F1, #4F46E5);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      border: none;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
      transition: all 0.2s ease;
    }
    .btn-primary-glow:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(99, 102, 241, 0.45);
    }
  </style>
</head>
<body>

<div class="error-container">
  <div class="error-card">
    <a href="/">
      <img src="{{ url_for('static', filename='img/logo.webp') }}" alt="padikkunnundo.app logo" class="error-logo">
    </a>
    <div>
      <span class="error-code-pill-red">&#9888;&#65039; 500 SERVER ERROR</span>
    </div>
    <h1 class="error-title">Something went wrong</h1>
    <p class="error-desc">
      We encountered an unexpected issue on our server. Don't worry, your academic marks and data are completely safe!
    </p>

    <div class="error-actions">
      <button onclick="location.reload()" class="btn-secondary-dark">
        &#128259; Try Reloading
      </button>
      <a href="/dashboard" class="btn-primary-glow">
        &#127968; Back to Dashboard
      </a>
    </div>
  </div>
</div>

</body>
</html>
