<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 — Server Error | padikkunnundo.app</title>
  <meta name="description" content="An unexpected server error occurred.">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/favicon-16x16.png') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <style>
    .error-page-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-lg);
      background: var(--bg-secondary);
    }
    .error-card-light {
      max-width: 500px;
      width: 100%;
      background: #ffffff;
      border: 1.5px solid var(--border-color);
      border-radius: 24px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.05);
    }
    .error-logo-img {
      height: 52px;
      width: auto;
      margin-bottom: 24px;
    }
    .error-pill-red {
      display: inline-block;
      padding: 5px 16px;
      border-radius: 99px;
      background: #fef2f2;
      border: 1.5px solid #fecaca;
      color: #dc2626;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 18px;
    }
    .error-heading {
      font-size: 26px;
      font-weight: 900;
      color: var(--text-primary);
      margin-bottom: 12px;
    }
    .error-text {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .error-btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-secondary-light {
      border: 1.5px solid var(--border-color);
      background: #ffffff;
      color: var(--text-primary);
      padding: 0.85rem 1.5rem;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-secondary-light:hover {
      background: var(--bg-secondary);
      border-color: var(--gray-300);
    }
  </style>
</head>
<body class="onboarding-body">

<div class="error-page-wrapper">
  <div class="error-card-light">
    <a href="/">
      <img src="{{ url_for('static', filename='img/logo_about.webp') }}" alt="padikkunnundo.app logo" class="error-logo-img">
    </a>
    <div>
      <span class="error-pill-red">500 SERVER ERROR</span>
    </div>
    <h1 class="error-heading">Something went wrong</h1>
    <p class="error-text">
      We encountered an unexpected issue on our server. Don't worry, your academic marks and data are completely safe.
    </p>

    <div class="error-btn-group">
      <button onclick="location.reload()" class="btn-secondary-light">
        Try Reloading
      </button>
      <a href="/dashboard" class="btn-primary" style="width: auto; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; padding: 0.85rem 1.6rem;">
        Back to Dashboard
      </a>
    </div>
  </div>
</div>

</body>
</html>
